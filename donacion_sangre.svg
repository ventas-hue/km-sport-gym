<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7F1D1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="1000" fill="url(#bg)" rx="20"/>

  <!-- Circulos decorativos -->
  <circle cx="650" cy="120" r="180" fill="#ffffff" opacity="0.04"/>
  <circle cx="100" cy="850" r="220" fill="#ffffff" opacity="0.04"/>
  <circle cx="700" cy="900" r="100" fill="#ffffff" opacity="0.03"/>

  <!-- Gota de sangre grande central -->
  <g transform="translate(400, 340)" filter="url(#shadow)">
    <path d="M0,-160 C0,-160 -120,20 -120,100 C-120,166 -66,220 0,220 C66,220 120,166 120,100 C120,20 0,-160 0,-160 Z" fill="url(#dropGrad)"/>
    <ellipse cx="-35" cy="60" rx="25" ry="40" fill="#ffffff" opacity="0.2" transform="rotate(-15, -35, 60)"/>
  </g>

  <!-- Corazon dentro de la gota -->
  <g transform="translate(400, 380)">
    <path d="M0,25 C0,25 -40,-10 -40,-30 C-40,-50 -20,-55 0,-35 C20,-55 40,-50 40,-30 C40,-10 0,25 0,25 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Numero 3 destacado con circulo -->
  <g transform="translate(400, 640)">
    <circle cx="0" cy="0" r="70" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="55" fill="#ffffff" filter="url(#glow)"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#DC2626">3</text>
  </g>

  <!-- Texto principal -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="4" opacity="0.9">DONA SANGRE</text>

  <!-- Linea decorativa -->
  <rect x="300" y="190" width="200" height="3" rx="2" fill="#ffffff" opacity="0.5"/>

  <!-- Pregunta principal -->
  <text x="400" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">
    <tspan x="400" dy="0">&#191;Sab&#237;as que</tspan>
  </text>

  <text x="400" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" opacity="0.95">
    <tspan x="400" dy="0">1 donante salva</tspan>
  </text>

  <text x="400" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#FCD34D" filter="url(#glow)">3 VIDAS</text>

  <!-- Linea separadora -->
  <rect x="250" y="830" width="300" height="2" rx="1" fill="#FCD34D" opacity="0.5"/>

  <!-- Mensaje inferior -->
  <text x="400" y="880" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" opacity="0.9" font-style="italic">
    <tspan x="400" dy="0">Tu donaci&#243;n es un</tspan>
  </text>
  <text x="400" y="920" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#FCD34D">acto de amor</text>

  <!-- Icono corazon pequeno junto al texto final -->
  <g transform="translate(580, 908)">
    <path d="M0,8 C0,8 -12,-4 -12,-10 C-12,-16 -6,-18 0,-12 C6,-18 12,-16 12,-10 C12,-4 0,8 0,8 Z" fill="#FCD34D" opacity="0.8"/>
  </g>

  <!-- Gotas pequenas decorativas -->
  <g transform="translate(150, 300)" opacity="0.15">
    <path d="M0,-30 C0,-30 -20,5 -20,18 C-20,29 -11,38 0,38 C11,38 20,29 20,18 C20,5 0,-30 0,-30 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(650, 250)" opacity="0.1">
    <path d="M0,-25 C0,-25 -16,4 -16,15 C-16,24 -9,32 0,32 C9,32 16,24 16,15 C16,4 0,-25 0,-25 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(680, 700)" opacity="0.12">
    <path d="M0,-20 C0,-20 -13,3 -13,12 C-13,19 -7,25 0,25 C7,25 13,19 13,12 C13,3 0,-20 0,-20 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(120, 650)" opacity="0.1">
    <path d="M0,-22 C0,-22 -14,3 -14,13 C-14,21 -8,27 0,27 C8,27 14,21 14,13 C14,3 0,-22 0,-22 Z" fill="#ffffff"/>
  </g>
</svg>
